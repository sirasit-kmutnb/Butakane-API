# === Server ===
server.port=8081

# === Database (MySQL) ===
spring.datasource.url=jdbc:mysql://mysql-alpha.infra.svc.cluster.local:3306/app_butakane?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === Flyway ===
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# === JWT Config ===
jwt.secret=2sAz1mM+DUGNw32aQy8IfxYcYqlTZLznGEGy8haIjhk=
jwt.expiration-ms=86400000

# === Logging (optional but helpful) ===
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.root=INFO

# Remove the /actuator prefix
management.endpoints.web.base-path=/

# Explicitly expose the /refresh and /env endpoints
management.endpoints.web.exposure.include=refresh,env,mappings

# Enable the individual endpoints (optional but recommended)
management.endpoint.refresh.enabled=true
management.endpoint.env.enabled=true
